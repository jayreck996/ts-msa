name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'back.tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run tests
        run: dotnet test back.tests/QuizApi.Tests.csproj --no-build --verbosity normal
        working-directory: .

      - name: Build & publish
        run: dotnet publish back/QuizApi.csproj -c Release -o ./publish
        working-directory: .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: quizapi-ts-msa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
