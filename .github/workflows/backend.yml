name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'back.tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run tests
        run: dotnet test back.tests/QuizApi.Tests.csproj --verbosity normal

      - name: Build & publish
        run: dotnet publish back/QuizApi.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip . && cd ..

      - name: Deploy via Kudu ZipDeploy
        # Creds via env: the Kudu username starts with '$' ($quizapi-ts-msa); injecting
        # it directly into a double-quoted bash string makes bash expand it. Env-var
        # VALUES are not re-expanded, so pass them through env and use -u "$USER:$PASS".
        env:
          KUDU_USER: ${{ secrets.AZURE_WEBAPP_USERNAME }}
          KUDU_PASS: ${{ secrets.AZURE_WEBAPP_PASSWORD }}
        run: |
          curl -X POST \
            "https://quizapi-ts-msa.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "$KUDU_USER:$KUDU_PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @publish.zip \
            --max-time 300 \
            --fail \
            --silent \
            --show-error
