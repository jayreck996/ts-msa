name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'back.tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run tests
        run: dotnet test back.tests/QuizApi.Tests.csproj --verbosity normal

      - name: Build & publish
        run: dotnet publish back/QuizApi.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip . && cd ..

      - name: Deploy via Kudu ZipDeploy
        run: |
          curl -X POST \
            "https://quizapi-ts-msa.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "${{ secrets.AZURE_WEBAPP_USERNAME }}:${{ secrets.AZURE_WEBAPP_PASSWORD }}" \
            -H "Content-Type: application/zip" \
            --data-binary @publish.zip \
            --max-time 300 \
            --verbose
